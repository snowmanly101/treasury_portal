<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Establishing Secure Connection...</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #f1c40f;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        // Automatically redirect to OTP verification page after 3 seconds of rolling animation
        setTimeout(function() {
            window.location.href = "{% url 'verify_otp' %}";
        }, 3000);
    </script>
</head>
<body>
    <div class="spinner"></div>
    <h2>Authenticating Credentials...</h2>
    <p>Please wait while we establish a secure tunnel to the Treasury Server.</p>
</body>
</html>
