<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classified Federal Treasury - Secure Client Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: rgba(15, 23, 42, 0.92);
            border: 1px solid #d4af37;
            border-radius: 8px;
            width: 90%;
            max-width: 420px;
            padding: 40px 30px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            text-align: center;
        }

        h2 {
            color: #d4af37;
            margin-bottom: 5px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f59e0b 0%, #d4af37 100%);
            border: none;
            border-radius: 4px;
            color: #0f172a;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .footer-link {
            display: block;
            margin-top: 25px;
            color: #d4af37;
            font-size: 13px;
            text-decoration: none;
        }

        .footer-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 25px 20px;
                width: 95%;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Secure Client Login</h2>
        <div class="subtitle">Classified Federal Treasury &bull; Estonia</div>

        <form method="POST">
            {% csrf_token %}
            
            {% if form.errors %}
                <div style="background-color: rgba(220, 38, 38, 0.2); border: 1px solid #dc2626; color: #fca5a5; padding: 10px; border-radius: 4px; font-size: 13px; margin-bottom: 20px;">
                    Invalid credentials. Please check your details and try again.
                </div>
            {% endif %}

            <div class="form-group">
                <label for="id_username">Account ID or Username</label>
                <input type="text" name="username" id="id_username" placeholder="Enter your identifier" required>
            </div>

            <div class="form-group">
                <label for="id_password">Password / Security PIN</label>
                <input type="password" name="password" id="id_password" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <a href="#" class="footer-link">&larr; View Premium Card Services</a>
    </div>

</body>
</html>
