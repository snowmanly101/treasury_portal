<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Challenge - Classified Federal Treasury</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b1329;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 40px;
            border-radius: 8px;
            width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 {
            color: #e2b714;
            margin-top: 0;
            font-size: 22px;
            text-align: center;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        input:focus {
            outline: none;
            border-color: #e2b714;
        }
        button {
            width: 100%;
            background: #e2b714;
            color: #0f172a;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover {
            opacity: 0.9;
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Security Verification</h2>
        <p>Please answer your security challenge question to continue.</p>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label for="security_answer">What is the city of your birth?</label>
            <input type="text" id="security_answer" name="security_answer" required placeholder="Enter answer">
            <button type="submit">Verify & Proceed</button>
        </form>
    </div>
</body>
</html>
